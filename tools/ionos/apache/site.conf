# Local stand-in for the IONOS webspace (tools/ionos/container.mjs): the same folder layout,
# .htaccess allowed everywhere in the webroot, nothing else configured.
<VirtualHost *:80>
  DocumentRoot /var/www/royalspices
  <Directory /var/www/royalspices>
    AllowOverride All
    Require all granted
  </Directory>
</VirtualHost>
